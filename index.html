<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E9E2; --surface:#F5F7F2; --ink:#1B2620; --muted:#5D6B63; --line:#C9D1C7;
  --wood:#4A2C1D; --wood2:#3A2116; --fret:#C8C1B1; --pearl:#EFE7D6; --gold:#E9A93A;
  --good:#2F9E6B; --bad:#D1495B; --dim:rgba(228,233,226,.72);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161E23; --surface:#212C33; --ink:#ECE4D3; --muted:#98A39D; --line:#34424B;
    --dim:rgba(22,30,35,.74); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161E23; --surface:#212C33; --ink:#ECE4D3; --muted:#98A39D; --line:#34424B;
  --dim:rgba(22,30,35,.74); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px}
header{display:flex;align-items:center;gap:10px}
h1{font-size:1.05rem;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.stats{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.25}
.stats b{color:var(--ink);font-weight:600}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:1rem;cursor:pointer}

.modes{display:grid;grid-template-columns:repeat(5,auto);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.modes button{border:0;background:none;padding:8px 4px;border-radius:9px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--wood);color:var(--pearl)}

.prompt{min-height:2.6em;font-size:.95rem;line-height:1.3;display:flex;align-items:center;gap:10px}
.prompt .big{font-size:1.6rem;font-weight:700;line-height:1;min-width:1.6em;text-align:center}
.prompt .sub{color:var(--muted);font-size:.82rem}
.prompt.flash{animation:flash .5s}
.prompt[hidden]{display:none}
@keyframes flash{50%{color:var(--bad)}}

.neck-wrap{flex:1;min-height:0;display:flex;justify-content:center}
/* phone portrait: the neck keeps a usable height and a long panel scrolls instead of squashing it */
.app:not(.wide):not(.land) .neck-wrap{min-height:min(230px,32vh)}
.app.m-drill:not(.wide):not(.land) .neck-wrap{flex:0 0 min(260px,34vh)}
.app:not(.wide):not(.land):not(.m-practice) .panel{flex:0 1 auto;min-height:0;overflow:auto}
.app:not(.wide):not(.land):not(.m-practice) .panel>*{flex-shrink:0}
.neck{position:relative;height:100%;width:100%;max-width:380px;display:grid;
  grid-template-columns:26px repeat(6,minmax(0,1fr));grid-template-rows:repeat(13,minmax(0,1fr))}
.fnum{grid-column:1;display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.fnum.mark{color:var(--ink);font-weight:600}
.wood{grid-column:2/8;grid-row:2/14;border-radius:0 0 6px 6px;
  background:linear-gradient(90deg,var(--wood2),var(--wood) 30%,var(--wood) 70%,var(--wood2));z-index:0}
.fret{grid-column:2/8;z-index:1;pointer-events:none;position:relative}
.fret::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fret)}
.fret.nut::after{height:6px;bottom:-3px;background:var(--pearl)}
.hid{display:none!important}
.inlay{z-index:1;display:grid;place-items:center;pointer-events:none}
.inlay::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pearl);opacity:.55}
.strings{grid-column:2/8;grid-row:1/14;display:flex;z-index:2;pointer-events:none}
.strings span{flex:1;position:relative}
.strings span::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:var(--w);transform:translateX(-50%);
  background:linear-gradient(90deg,#8d877a,#e4ddcc,#8d877a);opacity:.9}
.cell{z-index:3;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0}
.cell.out{background:var(--dim);cursor:default}
.dot{width:var(--dot,30px);height:var(--dot,30px);border-radius:50%;display:grid;place-items:center;
  background:var(--c);color:#14110d;font-weight:700;font-size:calc(var(--dot,30px)*.4);line-height:1;
  box-shadow:0 1px 0 rgba(0,0,0,.35);animation:pop .16s ease-out}
.dot.root{background:var(--gold);box-shadow:0 0 0 3px var(--pearl)}
.dot.octroot{background:var(--gold);opacity:.85}
.dot.ask{background:var(--pearl);box-shadow:0 0 0 3px var(--gold)}
.dot.faint{opacity:.55}
.dot.wrong{box-shadow:0 0 0 3px var(--bad)}
.dot.right{box-shadow:0 0 0 3px var(--good)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.dot,.prompt.flash{animation:none}}

.panel{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ivchip{flex:none;width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;position:relative}
.ivchip[aria-pressed="true"]{background:var(--c);color:#14110d;border-color:transparent}
.answers{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ans{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:700;font-size:.95rem;cursor:pointer}
.ans.right{background:var(--good);color:#fff;border-color:var(--good)}
.ans.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.actions{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--wood);color:var(--pearl);border-color:var(--wood)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:.78rem;color:var(--muted);margin:0}

.goal{display:flex;flex-direction:column;gap:6px}
.focus{display:flex;gap:6px;align-items:stretch}
.focus-sum{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;line-height:1.25}
.focus-sum b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-sum span{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.focus .icon{height:auto;width:40px}
.seg.fmode{flex:none;flex-direction:column;border-radius:12px;padding:2px;align-items:stretch}
.seg.fmode button{border-radius:8px;padding:3px 10px;font-size:.78rem}
.goal:not(.fsong) .fs,.goal.fsong .fk{display:none}
.app.wide .goal.fsong .focus-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr);max-width:760px}
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px}
.focus-grid[hidden]{display:none}
.focus-grid label{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);min-width:0}
.focus-grid select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px;width:100%;min-width:0}
.dot.ghost{opacity:.28}

.dot.pass{background:var(--pearl);color:#4d453a;font-weight:600;transform:scale(.8)}
.dot.home{box-shadow:0 0 0 3px var(--gold)}
.dot.now{transform:scale(1.2);box-shadow:0 0 0 3px var(--ink),0 0 16px 2px var(--c,var(--pearl));z-index:2;position:relative;animation:none}
.dot.nextup{outline:2px dashed var(--ink);outline-offset:2px;animation:none}
.drow{display:flex;gap:6px;align-items:center}
.drow select,.transport select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 4px;min-width:0;flex:1}
.tab{overflow-x:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;scrollbar-width:none;flex:none}
.tab::-webkit-scrollbar{display:none}
.tabin{display:inline-flex;padding:0 8px}
.tcol{display:flex;flex-direction:column;width:21px;flex:none;text-align:center;border-radius:5px}
.tcol.beat{margin-left:5px}
.tcol.bar{margin-left:9px;box-shadow:-5px 0 0 -4px var(--muted)}
.tcol span{height:12px;line-height:12px;font-size:10px}
.tcol .ln{background:linear-gradient(transparent 5.5px,var(--line) 5.5px,var(--line) 6.5px,transparent 6.5px)}
.tcol .ln b{background:var(--surface);padding:0 2px;font-weight:700}
.tcol .ln b.mx{color:var(--muted);font-weight:400}
.tcol .dg{margin-top:3px;font-weight:700}
.tcol .fg{color:var(--muted)}
.tcol.now{background:color-mix(in srgb,var(--gold) 35%,transparent)}
.tcol.now .ln b{background:transparent}
.transport{display:flex;gap:6px;align-items:stretch}
.transport .icon{height:auto;width:40px;font-size:1.1rem}
.bpm{min-width:66px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:1.1rem;line-height:1.05;padding:4px 2px;cursor:pointer}
.bpm small{display:block;font-size:.62rem;color:var(--muted);font-weight:400}
.transport .play{flex:1.1;min-width:72px}
.row select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 8px;flex:none}

.side{display:contents}
/* horizontal neck (wide screens) */
.neck.h .wood{border-radius:0 6px 6px 0;background:linear-gradient(180deg,var(--wood2),var(--wood) 22%,var(--wood) 78%,var(--wood2))}
.neck.h .fret::after{left:auto;right:-1px;top:0;bottom:0;width:2px;height:auto}
.neck.h .fret.nut::after{width:7px;right:-4px;top:0;bottom:0;height:auto}
.neck.h .strings{flex-direction:column-reverse}
.neck.h .strings span::after{left:0;right:0;top:50%;bottom:auto;width:auto;height:var(--w);transform:translateY(-50%);background:linear-gradient(180deg,#8d877a,#e4ddcc,#8d877a)}
.neck.h .inlay::after{width:14px;height:14px}
/* wide layout */
html.wide{font-size:19px}
.app.wide{max-width:none;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);
  grid-template-areas:"head head" "goal goal" "side neck" "side panel";gap:18px 32px;padding:18px 32px 22px}
.app.wide header{grid-area:head}
.app.wide h1{font-size:1.35rem}
.app.wide .side{display:flex;flex-direction:column;gap:12px;grid-area:side;min-height:0;overflow:auto}
.app.wide .side>*{flex-shrink:0}
.app.wide .focus-grid[hidden]{display:grid}
/* wide: the focus is one row under the title, its settings always open beside it */
.app.wide .goal{grid-area:goal;flex-direction:row;gap:12px;align-items:stretch}
.app.wide .focus{flex:0 0 440px;min-width:0}
.app.wide .focus-sum{cursor:default}
.app.wide .focus-grid{flex:1;grid-template-columns:repeat(4,minmax(0,1fr));max-width:1100px;padding:6px 10px 8px}
.app.wide .prompt{font-size:1rem;align-items:flex-start}
.app.wide .prompt .big{font-size:2.1rem}
.app.wide .neck-wrap{grid-area:neck;flex:none;height:clamp(240px,42vh,620px)}
.app.wide .neck{max-width:none;height:100%}
.app.wide .panel{grid-area:panel;min-height:0;overflow:auto;gap:12px;align-content:start}
.app.wide .row{flex-wrap:wrap;overflow:visible}
.app.wide .answers,.app.wide .actions,.app.wide .drow,.app.wide .transport{max-width:900px}
.app.wide .tab{padding:8px 0}
.app.wide .tcol{width:30px}
.app.wide .tcol span{height:17px;line-height:17px;font-size:13px}
.app.wide .tcol .ln{background:linear-gradient(transparent 8px,var(--line) 8px,var(--line) 9px,transparent 9px)}
.app.wide .tcol.beat{margin-left:8px}
.app.wide .tcol.bar{margin-left:14px;box-shadow:-8px 0 0 -7px var(--muted)}
.chip.tog[aria-pressed="true"]::before{content:"✓ "}
.seg{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.segw{display:inline-flex;align-items:center;gap:6px;flex:none}
.seglab{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.voice-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.voice-card[hidden]{display:none}
.vc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vc-head b{font-size:1.25rem}
.vc-head span{color:var(--muted);font-size:.85rem}
.vc-diag{display:block;width:100%;border:0;background:none;padding:6px 0 0;cursor:pointer;color:var(--ink)}
.vc-diag svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.vc-diag:hover svg{opacity:.85}
.voice-card p{margin:4px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
.voice-card code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-size:.9rem;letter-spacing:.08em}
.dot.vc{outline:3px solid var(--gold);outline-offset:3px}
.dot.outk{border:2px dashed #14110d}
.ex-song{display:flex;flex-direction:column;gap:10px}
.ex-song p{margin:0;font-size:.86rem;line-height:1.45}
.ex-sum{color:var(--muted)}.ex-sum b{color:var(--ink)}
.cchip.outk{border-style:dashed;border-color:var(--bad)}
.cchip.ex-ch small{font-family:"Times New Roman",Georgia,serif;font-size:.84rem}
.ex-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ex-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex-name{font-size:1.3rem}
.ex-head .rn{font-family:"Times New Roman",Georgia,serif;color:var(--muted);font-size:1.05rem}
.ex-tag{margin-left:auto;font-size:.74rem;color:var(--good)}.ex-tag.out{color:var(--bad)}
.exns{display:flex;flex-wrap:wrap;gap:6px}
.exn{display:flex;flex-direction:column;border-left:4px solid var(--c);padding:1px 8px;line-height:1.2}
.exn small{font-size:.72rem;color:var(--muted)}
.exn.outk{border-left-style:dashed}
.ex-play{align-items:center}.ex-play code{font-size:.9rem;letter-spacing:.06em}
.ex-parts{display:flex;flex-direction:column;gap:6px}
.ex-part{display:flex;flex-direction:column;gap:3px;min-width:0}
.app.wide .sh-bars.ex-bars{display:flex;flex-wrap:wrap}
.vc-formula{margin-top:8px}
.vc-formula>div{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-width:2.3em;text-align:center;padding:4px 8px;border-radius:8px;background:var(--c);color:#14110d;font-weight:700;font-size:.95rem}
.fchip.off{background:none;color:var(--muted);box-shadow:inset 0 0 0 2px var(--c);text-decoration:line-through}
.voice-card .vc-formula p{text-align:left;margin-top:6px}
.vc-head b.rn{font-family:"Times New Roman",Georgia,serif;font-size:1.35rem;color:var(--gold);font-weight:700}
.rn-strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.rn-strip button{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 7px;cursor:pointer;font-family:"Times New Roman",Georgia,serif;font-size:.95rem;color:var(--muted)}
.rn-strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.voice-card p.vc-shape{text-align:left;margin-top:8px}
.tcol.chordcol{width:auto;min-width:21px;padding:0 3px;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tcol.chordcol.now{background:color-mix(in srgb,var(--gold) 40%,transparent)}
.tcol.chordcol .fg{font-size:9px}
.tcol.chordcol,.app.wide .tcol.chordcol{width:max-content;padding:0 5px 0 3px;white-space:nowrap}
.tcol.strumcol .dg{font-size:13px;color:var(--ink)}
.tcol.strumcol.ghost .dg{opacity:.22;font-weight:400}
.tcol.strumcol.acc .dg{color:var(--gold)}
.app.wide .tcol.strumcol .dg{font-size:16px}
#tip{position:fixed;left:0;top:0;z-index:1000;max-width:290px;background:var(--ink);color:var(--bg);font-size:.8rem;line-height:1.4;
  padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#tip.on{opacity:1}
#tip b{font-weight:700}
@media (prefers-reduced-motion: reduce){#tip{transition:none}}
.term{border-bottom:1px dotted currentColor;cursor:help;text-decoration:none}
.term:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:2px}
.st-lab{margin:8px 0 4px!important;color:var(--muted);font-size:.8rem;text-align:left!important}
.stack{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px}
.st-deg{font-weight:700;font-size:1rem;min-width:1.4em;text-align:center}
.st-step{display:inline-flex;flex-direction:column;align-items:center;font-size:.78rem;color:var(--muted);padding:0 4px;position:relative}
.st-step::after{content:"→";font-size:.9rem;line-height:.8}
.st-step small{font-size:.65rem;order:2}
#gloss{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#gloss[hidden]{display:none}
.gl-panel{background:var(--surface);color:var(--ink);border-radius:16px;width:min(720px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.gl-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.gl-top h2{margin:0;font-size:1.15rem}
.gl-body{overflow:auto;padding:0 16px 16px}
.gl-body h3{font-size:.8rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
.gl-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px}
.gl-row>div{flex:1}
.gl-row p{margin:3px 0 0;font-size:.88rem;line-height:1.45}
.gl-row.hl{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.gl-hs{font-size:.75rem;color:var(--muted)}

/* strum grid with counting under each step (Drill progressions) */
.rgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px 0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;flex:none}
.rstep{border:0;background:none;padding:2px 0 3px;margin:0 1px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.rstep.beat{border-left:2px solid var(--line);border-radius:0 7px 7px 0;margin-left:2px}
.rstep:first-child{border-left:0}
.rstep b{font-size:1.35rem;line-height:1.2;height:1.2em;font-weight:700}
.rstep.ghost b{opacity:.2;font-weight:400}
.rstep.mute b{color:var(--bad)}
.rstep.acc b{color:var(--gold)}
.rstep small{font-size:.72rem;color:var(--muted);font-weight:600}
.rstep.onbeat small{color:var(--ink)}
.rstep.now{background:color-mix(in srgb,var(--gold) 38%,transparent)}
.rchords{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rchords select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 4px}
.rchords select:disabled{opacity:.4}
.rchords .hint{flex:1;min-width:10em}
.rchords .now{outline:2px solid var(--gold)}

  const key=cur.key, A=[...cur.set].sort((a,b)=>a-b);
  if(A.length===7){
    return A.map((d,i)=>{
      const tones=[0,2,4].concat(D.sev?[6]:[]).map(k=>A[(i+k)%7]);
      const rel=tones.map(t=>(t-d+12)%12);
      const q=QUAL[rel.slice(1).join(',')]??null;
      let rn=ROMAN[i]; if(rel[1]===3) rn=rn.toLowerCase();
      const a=d-MAJ[i], acc=a<0?'♭'.repeat(-a):'♯'.repeat(a);
      return {root:(key+d)%12,tones,rel,name:noteName((key+d)%12)+qname(q,rel),roman:acc+rn+(q===null?'*':(RN_SUF[q]??''))};
    });
  }
  let list=FIXED.filter(([q,r])=>r.every(x=>cur.set.has(x)));
  if(!list.length){ // no standard chord fits: stack every other scale tone from the root
    const r=[A[0],A[2],A[4]].filter(x=>x!==undefined);
    list=[[QUAL[r.slice(1).join(',')]??null,r]];
  }
  return list.map(([q,r])=>({root:key,tones:r,rel:r,name:keyName(key)+qname(q,r),roman:(r[1]===3?'i':'I')+(q===null?'*':(RN_SUF[q]??''))}));
}

}

  cur.pos=positions(F.key);

  if(!p&&F.pos>=0){const lo=Math.min(8,F.pos); p={lo,hi:lo+4,label:`Frets ${lo}–${lo+4}`,custom:true};}

    // each chord of the progression, voiced inside the box (frets 0–4 gives open chords); a song brings its own chords

    const items=song?song.bars.flatMap((b,bar)=>b.segs.map(x=>({ch:chordIn(x.name,cur.key),bar,from:x.from,to:x.to,part:b.part})))
      :PROG_FIX[D.prog]?progChords(D.prog,followKey(),D.sev).map((ch,bar)=>({ch,bar,from:0,to:1,part:-1}))
      :(PROG_BY[D.prog]||PROG_BY.pop).degs.map((d,bar)=>({ch:cur.pchords[d],bar,from:0,to:1,part:-1}));
    cur.prog=items.map((it,d)=>{

let ac=null;

function toneAt(midi,t,vol=0.28,len=1.5){
  try{
    const f=440*Math.pow(2,(midi-69)/12);
    const o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter(), g2=ac.createGain();
    o.type='triangle'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2; g2.gain.value=0.25;
    lp.type='lowpass'; lp.frequency.setValueAtTime(3200,t); lp.frequency.exponentialRampToValueAtTime(700,t+1);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(ac.destination);
    o.start(t); o2.start(t); o.stop(t+len+0.1); o2.stop(t+len+0.1);
  }catch(e){}
}
function tone(midi,delay=0){if(!saved.sound) return; try{ensureAC(); toneAt(midi,ac.currentTime+delay);}catch(e){}}

function voicingOK(frets,R,want,fifths){

  if(played.some(x=>!want.has(x))) return false;

function findVoicing(){

    if(B===R) return [frets];

    for(const s of [s0-1,s0-2]) if(s>=0) for(let f=0;f<=12;f++) if(inPos(f)&&pc(s,f)===B) out.push(frets.map((x,i)=>i===s?f:x));
    for(let s=s0+1;s<6;s++) if(frets[s]!==null&&pc(s,frets[s])===B){if(frets.slice(s).filter(f=>f!==null).length>=4) out.push(frets.map((f,i)=>i<s?null:f)); break;}

// ---------- drill generation ----------
function boxNotes(){
  if(cur.whole&&D.line!=='prog'&&cur.pos.length) return climbNotes();
  const list=[];
  for(let s=0;s<6;s++)for(let f=cur.lo;f<=cur.hi;f++) if(cur.set.has(ivOf({s,f},cur.key))) list.push({s,f,m:MIDI[s]+capo()+f});
  list.sort((a,b)=>a.m-b.m||b.s-a.s); // same pitch twice: keep the higher string (less stretching)
  return list.filter((n,i)=>i===0||n.m!==list[i-1].m);
}
function climbNotes(){
  // the whole neck as one run: every scale note from the lowest root of the first shape up to the top of the last,
  // shifting up through the shapes in order, so each shape gets its share of the run (each note keeps its box for fingering)
  const S=F.fam==='chrom'?cur.pos.filter(p=>p.lo%4===0):cur.pos, all=[]; // all 12 notes: three boxes, frets 0–4, 4–8 and 8–12
  for(let s=0;s<6;s++)for(let f=0;f<=12;f++) if(cur.set.has(ivOf({s,f},cur.key))) all.push({s,f,m:MIDI[s]+capo()+f});
  const inBox=(n,b)=>n.f>=b.lo-(b.lo?0:1)&&n.f<=b.hi;
  const first=all.filter(n=>inBox(n,S[0])&&pc(n.s,n.f)===cur.key).sort((a,b)=>a.m-b.m)[0];
  const top=Math.max(...all.filter(n=>n.s===5&&inBox(n,S[S.length-1])).map(n=>n.m));
  if(!first||!isFinite(top)) return [];
  const pitches=[...new Set(all.map(n=>n.m))].filter(m=>m>=first.m&&m<=top).sort((a,b)=>a-b), out=[];
  let prev=first;
  pitches.forEach((m,i)=>{
    const b=S[Math.min(S.length-1,Math.floor(i*S.length/pitches.length))];
    const c=i?all.filter(n=>n.m===m&&n.s>=prev.s):[first];
    const run=out.filter(x=>x.s===prev.s).length; // three notes on a string, then cross to the next
    const cost=n=>(n.f<b.lo?b.lo-n.f:n.f>b.hi?n.f-b.hi:0)*3+Math.abs(n.f-prev.f)*0.3+(n.s-prev.s)*0.2+(n.s===prev.s&&run>=3?4:0);
    const n=c.sort((x,y)=>cost(x)-cost(y))[0]; if(!n) return;
    out.push({...n,lo:b.lo}); prev=n;
  });
  return out;
}
function arpNotes(p){
  // the strummed voicing, one string at a time, low to high and back; with no voicing, the chord tones in the box from the lowest root
  if(p.voicing) return upDown(p.voicing.frets.map((f,s)=>f===null?null:{s,f,m:MIDI[s]+capo()+f}).filter(Boolean));
  const T=boxNotes().filter(n=>p.pcs.has(pc(n.s,n.f))), r=T.findIndex(n=>pc(n.s,n.f)===p.ch.root);
  const X=T.slice(Math.max(0,r)); return upDown((X.length>=3?X:T).slice(0,6));
}
function genProg(){
  // every chord gets a bar of the strum pattern, a bar of arpeggio, or both; steps carry their own length (n per bar)
  // a split bar changes chord partway through: each step plays whichever chord covers it (head marks a chord's first step)
  if(!cur.prog) return [];
  const seq=[]; let bar=0;
  for(let b=0;b<cur.nbars;b++){
    const idx=cur.prog.map((p,i)=>p.bar===b?i:-1).filter(i=>i>=0); if(!idx.length) continue;
    const at=f=>idx.find(i=>f<cur.prog[i].to-1e-9)??idx[idx.length-1];
    const P=patFor(cur.prog[idx[0]].part), voiced=idx.every(i=>cur.prog[i].voicing);
    if(D.plan!=='arp'&&voiced){ let prev=-1;
      for(let k=0;k<P.res;k++){const ci=at(k/P.res); seq.push({chord:true,strum:P.steps[k],ci,bar,k,n:P.res,sw:P.swing,live:!!P.live,head:ci!==prev}); prev=ci;} bar++; }
    if(D.plan!=='strum'||!voiced){
      const A={}, L=4*D.sub; idx.forEach(i=>A[i]=arpNotes(cur.prog[i]));
      if(!idx.some(i=>A[i].length)) continue;
      let prev=-1, s0=0;
      for(let k=0;k<L;k++){const ci=at(k/L); if(ci!==prev) s0=k; const a=A[ci];
        seq.push(a.length?{...a[(k-s0)%a.length],ci,bar,k,n:L,sw:P.swing,head:ci!==prev}:{rest:true,ci,bar,k,n:L,head:ci!==prev}); prev=ci;}
      bar++; }
  }

}
function genSeq(){
  if(D.line==='prog') return genProg();
  const seq=genLine();
  if(!D.pad||!cur.voicing||!seq.length) return seq;
  // Chord each bar: every bar opens with the chord on beat 1, and the line fills beats 2 to 4
  const out=[], per=3*D.sub; let i=0;
  while(i<seq.length){
    out.push({chord:true}); for(let r=1;r<D.sub;r++) out.push({rest:true});
    const chunk=seq.slice(i,i+per); i+=per;
    out.push(...chunk); for(let r=chunk.length;r<per;r++) out.push({rest:true});
  }
  return out;
}
function genLine(){
  // every drill starts and ends on a root: it steps in from the nearest root, and from its last note steps through
  // the box's scale notes to the nearest root (the key's root, or the chord's when that's chosen)
  const P=boxNotes(), home=D.resolve==='chord'?cur.chord.root:cur.key;
  const roots=P.map((p,k)=>pc(p.s,p.f)===home?k:-1).filter(k=>k>=0);
  const near=i=>roots.reduce((a,b)=>{const da=Math.abs(a-i),db=Math.abs(b-i);return db<da||(db===da&&b<a)?b:a;});
  let seq=genRaw();
  if(!seq.length||!roots.length) return seq;
  if(D.pattern==='updown'&&P.length>1){ // from the lowest root up to the top, down to the bottom, and back up to the root
    const r=roots[0]; seq=[...P.slice(r),...P.slice(0,-1).reverse(),...P.slice(1,r+1)];
  }else{
    const f=P.findIndex(p=>p.m===seq[0].m);
    if(f>=0){const r=near(f), dir=Math.sign(f-r), lead=[]; for(let i=r;i!==f;i+=dir) lead.push(P[i]); seq=[...lead,...seq];}
  }
  let i=P.findIndex(p=>p.m===seq[seq.length-1].m);
  if(i<0) return seq;
  const best=near(i), dir=Math.sign(best-i);
  while(i!==best){i+=dir; seq.push(P[i]);}

}
function genRaw(){
  const P=boxNotes(), n=P.length, seq=[];
  if(n<2) return P;
  const isC=p=>cur.chordPcs.has(pc(p.s,p.f));
  const upDown=X=>X.length<2?X:[...X,...X.slice(1,-1).reverse()];
  const groups=g=>{for(let i=0;i+g<=n;i++)for(let k=0;k<g;k++)seq.push(P[i+k]);
    for(let i=n-1;i-g+1>=0;i--)for(let k=0;k<g;k++)seq.push(P[i-k]);};
  switch(D.pattern){
    case 'updown': return upDown(P);
    case 'strings':
      for(let a=0;a<5;a++){const X=P.filter(p=>p.s===a||p.s===a+1); if(X.length) seq.push(...upDown(X));}
      return seq;
    case 'thirds':
      for(let i=0;i+2<n;i++) seq.push(P[i],P[i+2]);
      for(let i=n-1;i-2>=0;i--) seq.push(P[i],P[i-2]);
      return seq;
    case 'g3': groups(3); return seq;
    case 'g4': groups(4); return seq;
    case 'arp': return upDown(P.filter(isC));
    case 'enclose':{
      const ks=P.map((p,i)=>isC(p)?i:-1).filter(i=>i>=0);
      const cell=k=>[P[k+1],P[k-1],P[k]].filter(Boolean);
      ks.forEach(k=>seq.push(...cell(k))); ks.slice(0,-1).reverse().forEach(k=>seq.push(...cell(k)));
      return seq;
    }
    case 'walk':{
      const ks=P.map((p,i)=>isC(p)?i:-1).filter(i=>i>=0);
      let pos=ks[rnd(ks.length)]; const len=D.sub*8;
      for(let j=0;j<len;j++){
        if(j%D.sub===0){const near=ks.filter(k=>Math.abs(k-pos)<=3&&k!==pos); pos=near.length?near[rnd(near.length)]:ks[rnd(ks.length)];}
        else{const steps=[-2,-1,1,2]; pos=Math.max(0,Math.min(n-1,pos+steps[rnd(4)]));}

    }

}
function regen(){
  st.seq=genSeq();
  if(st.playing){met.k=0; met.step=0; logStop(); logStart();} // restart the drill on the next step, counted as a fresh downbeat
  st.paused=false; st.resumeK=0;

}

// ---------- metronome ----------
const met={timer:null,next:0,step:0,k:0,queue:[],raf:0,taps:[]};
function startMet(fromK=0){
  ensureAC();
  if(!st.seq.length) st.seq=genSeq();
  if(!st.seq.length) return;
  logStop(); logStart();
  met.step=D.line==='prog'?-4:-4*D.sub; met.k=fromK<st.seq.length?fromK:0; st.paused=false; met.next=ac.currentTime+0.12; met.queue=[];
  st.playing=true; st.idx=-1;
  met.timer=setInterval(schedule,25); schedule();
  cancelAnimationFrame(met.raf); met.raf=requestAnimationFrame(draw);
  render();
}
function stopMet(){
  logStop();
  clearInterval(met.timer); cancelAnimationFrame(met.raf);
  st.playing=false; st.paused=false; st.idx=-1; st.count=0; met.queue=[];
}
function pauseMet(){
  // keep the current note lit; resuming counts in and repeats the bar that was interrupted
  logStop();
  const bar=4*D.sub, idx=st.idx;
  let k=idx>=0?idx-idx%bar:met.k-met.k%bar;
  if(D.line==='prog'){const j=idx>=0?idx:Math.min(met.k,st.seq.length-1), b=st.seq[j]?st.seq[j].bar:0; k=st.seq.findIndex(n=>n.bar===b);}
  clearInterval(met.timer); cancelAnimationFrame(met.raf);
  st.playing=false; st.paused=true; st.count=0; met.queue=[];
  st.resumeK=Math.max(0,k);
  render();
}
function togglePlay(){
  if(st.playing) pauseMet(); else startMet(st.paused?st.resumeK:0);
}
function schedule(){
  if(D.line==='prog') return pschedule();
  const sub=D.sub;
  while(met.next<ac.currentTime+0.12){
    const i=met.step, t=met.next;
    const beatNo=Math.floor(i/sub), beat=((i%sub)+sub)%sub===0, bar=beat&&((beatNo%4)+4)%4===0;
    if(D.click||i<0){ if(beat) click(t,bar?1760:1175,bar?0.4:0.25); else if(D.click&&sub>1) click(t,880,0.06); }
    if(i<0){ if(beat) met.queue.push({t,count:beatNo+5}); }
    else{
      if(met.k>=st.seq.length){
        met.k=0; logPass();
        if(D.pattern==='walk'){st.seq=genSeq(); met.queue.push({t,newSeq:true});}
        if(D.ramp){saved.bpm=Math.min(260,saved.bpm+D.ramp); met.queue.push({t,bpm:true});}
      }
      const n=st.seq[met.k];
      if(n&&n.chord) strum(t,0.2);
      else if(n&&!n.rest&&D.notes) toneAt(MIDI[n.s]+capo()+n.f,t,0.26);
      met.queue.push({t,k:met.k}); met.k++;
    }
    met.next+=60/saved.bpm/sub; met.step++;
  }
}
function pschedule(){
  // progressions: a one-bar count-in of four clicks, then each step at its own bar's grid (strum bars 8 or 16, arpeggio bars 4 × notes per beat)
  while(met.next<ac.currentTime+0.12){
    const t0=met.next;
    if(met.step<0){
      click(t0,met.step===-4?1760:1175,met.step===-4?0.4:0.25); met.queue.push({t:t0,count:met.step+5});
      met.next+=60/saved.bpm; met.step++; continue;
    }
    if(met.k>=st.seq.length){
      met.k=0; logPass();
      if(D.ramp){saved.bpm=Math.min(260,saved.bpm+D.ramp); met.queue.push({t:t0,bpm:true});}
    }
    const n=st.seq[met.k], dur=60/saved.bpm*4/n.n, per=n.n/4;
    const t=t0+((n.sw??R.swing)&&(n.n===8||n.n===16)&&n.k%2===1?dur/3:0); // shuffle: the second of each pair lands two thirds of the way through
    if(n.k%per===0&&D.click) click(t,n.k===0?1760:1175,n.k===0?0.4:0.25);
    if(D.notes){
      const v=cur.prog[n.ci]&&cur.prog[n.ci].voicing;
      if(n.chord){ if(n.strum!=='.'&&v) rstrum(t,v,n.k%2===0,n.strum,dur); }
      else if(!n.rest) toneAt(MIDI[n.s]+capo()+n.f,t,0.26);

function draw(){
  const now=ac.currentTime; let changed=false, newTab=false, newChord=false;

    if('k' in e){st.count=0; st.idx=e.k;

  }

    case 'partadd':{const sk=LOG.skills[st.song]; if(!sk) return; const parts=songParts(sk).map(p=>({...p})), used=new Set(parts.map(p=>p.name));
      parts.push({name:['Chorus','Bridge','Intro','Outro','Solo'].find(x=>!used.has(x))||`Part ${parts.length+1}`,text:''}); saveParts(st.song,parts); render();

    case 'vpick':{const n=b.dataset.n, k=+b.dataset.part; st.vpick=st.vpick&&st.vpick.n===n&&st.vpick.part===k?null:{n,part:k}; render(); return;}

    default: return;
  }

};

function navNow(){return {mode:st.mode,song:st.mode==='songs'?(st.newSong?'+':st.song||null):null,sheet:!!st.sheet&&st.mode==='drill',gloss:!document.getElementById('gloss').hidden};}
const navKey=s=>s?[s.mode,s.song,s.sheet,s.gloss].join('|'):'';
function navSync(){
  if(st.navBusy||!window.history||!history.replaceState) return;
  const now=navNow(), hs=history.state, was=hs&&hs.fm;
  if(!was){history.replaceState({fm:now},''); return;} // the entry the page loaded into
  if(navKey(now)===navKey(was)) return;
  // closing the sheet or the glossary steps back over the entry that opening it added
  if(hs.pushed&&(was.sheet||was.gloss)&&navKey({...was,sheet:now.sheet,gloss:now.gloss})===navKey(now)){history.back(); return;}
  history.pushState({fm:now,pushed:true},'');
}
addEventListener('popstate',e=>{
  const s=e.state&&e.state.fm; if(!s) return;
  st.navBusy=true;
  try{
    if(!s.gloss&&!document.getElementById('gloss').hidden) closeGloss();
    if(s.mode!==st.mode) setMode(s.mode);
    if(s.mode==='songs'){
      st.newSong=s.song==='+'; st.vpick=null;
      if(s.song&&s.song!=='+'&&LOG.skills[s.song]){st.song=s.song; if(focusSong()&&saved.fsong!==s.song) setFocusSong(s.song);}
    }
    st.sheet=s.sheet&&st.mode==='drill'; render();
    if(s.gloss&&document.getElementById('gloss').hidden) openGloss();
  }finally{st.navBusy=false;}
  const now=navNow(); if(navKey(now)!==navKey(s)) history.replaceState({...e.state,fm:now},''); // the song it named is gone
});

function tabTip(el){

const TIP_SEL=TIPS.map(t=>t[0]).join(',');
const tipEl=document.getElementById('tip');
let tipTarget=null, tipTimer=null;
function tipFor(el){for(const [sel,fn] of TIPS) if(el.matches(sel)) return fn(el); return '';}
function showTip(el){
  if(!document.body.contains(el)) return;
  const html=tipFor(el); if(!html) return;
  tipEl.innerHTML=html; tipEl.classList.add('on');
  const r=el.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  let x=r.left+r.width/2-t.width/2, y=r.top-t.height-8;
  if(y<8) y=r.bottom+8;
  x=Math.max(8,Math.min(innerWidth-t.width-8,x));
  tipEl.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function hideTip(){clearTimeout(tipTimer); tipTarget=null; tipEl.classList.remove('on');}
document.addEventListener('pointerover',e=>{
  if(e.pointerType&&e.pointerType!=='mouse') return;
  const t=e.target.closest(TIP_SEL);
  if(t===tipTarget) return;
  hideTip(); if(!t) return;
  tipTarget=t; tipTimer=setTimeout(()=>showTip(t),tipEl.classList.contains('on')?0:380);
});
document.addEventListener('pointerout',e=>{if(e.pointerType&&e.pointerType!=='mouse') return; if(tipTarget&&!tipTarget.contains(e.relatedTarget)) hideTip();});
document.addEventListener('pointerdown',e=>{ if(!tipTarget) return; if(!tipTarget.contains(e.target)){ hideTip(); return;} setTimeout(()=>{if(tipTarget&&document.body.contains(tipTarget)) showTip(tipTarget); else hideTip();},30); });
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest(TIP_SEL); if(t&&t.matches(':focus-visible')){tipTarget=t; showTip(t);}});
