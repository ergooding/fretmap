<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E9E2; --surface:#F5F7F2; --ink:#1B2620; --muted:#5D6B63; --line:#C9D1C7;
  --wood:#4A2C1D; --wood2:#3A2116; --fret:#C8C1B1; --pearl:#EFE7D6; --gold:#E9A93A;
  --good:#2F9E6B; --bad:#D1495B; --dim:rgba(228,233,226,.72);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161E23; --surface:#212C33; --ink:#ECE4D3; --muted:#98A39D; --line:#34424B;
    --dim:rgba(22,30,35,.74); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161E23; --surface:#212C33; --ink:#ECE4D3; --muted:#98A39D; --line:#34424B;
  --dim:rgba(22,30,35,.74); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px}
header{display:flex;align-items:center;gap:10px}
h1{font-size:1.05rem;font-weight:700;margin:0;flex:1;letter-spacing:-.01em}
.stats{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.25}
.stats b{color:var(--ink);font-weight:600}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:1rem;cursor:pointer}
.hicon{color:var(--ink)}.hicon svg{width:20px;height:20px}

.modes{display:grid;grid-template-columns:repeat(5,auto);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.modes button{border:0;background:none;padding:8px 4px;border-radius:9px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--wood);color:var(--pearl)}

.prompt{min-height:2.6em;font-size:.95rem;line-height:1.3;display:flex;align-items:center;gap:10px}
.prompt .big{font-size:1.6rem;font-weight:700;line-height:1;min-width:1.6em;text-align:center}
.prompt .sub{color:var(--muted);font-size:.82rem}
.prompt.flash,.voice-card.flash{animation:flash .5s}
.prompt[hidden]{display:none}
@keyframes flash{50%{color:var(--bad)}}

.neck-box{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.neck-wrap{flex:1;min-height:0;display:flex;justify-content:center}
/* phone portrait: the neck keeps a usable height and a long panel scrolls instead of squashing it */
.app:not(.wide):not(.land) .neck-box{flex:0 0 auto}
.app:not(.wide):not(.land) .neck-wrap{flex:0 0 auto;display:block;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;overscroll-behavior-x:contain}
.app:not(.wide):not(.land) .neck{max-width:none;height:clamp(210px,32vh,280px)}
/* a phone's dots are small: the faded chord tones and the next chord's rings stay readable */
.app:not(.wide):not(.land):not(.m-practice) .panel{flex:0 1 auto;min-height:0;overflow:auto}
.app:not(.wide):not(.land):not(.m-practice) .panel>*{flex-shrink:0}
.neck{position:relative;height:100%;width:100%;max-width:380px;display:grid;
  grid-template-columns:26px repeat(6,minmax(0,1fr));grid-template-rows:repeat(13,minmax(0,1fr))}
.fnum{grid-column:1;display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.fnum.mark{color:var(--ink);font-weight:600}
.wood{grid-column:2/8;grid-row:2/14;border-radius:0 0 6px 6px;
  background:linear-gradient(90deg,var(--wood2),var(--wood) 30%,var(--wood) 70%,var(--wood2));z-index:0}
.fret{grid-column:2/8;z-index:1;pointer-events:none;position:relative}
.fret::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--fret)}
.fret.nut::after{height:6px;bottom:-3px;background:var(--pearl)}
.hid{display:none!important}
.inlay{z-index:1;display:grid;place-items:center;pointer-events:none}
.inlay::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pearl);opacity:.55}
.strings{grid-column:2/8;grid-row:1/14;display:flex;z-index:2;pointer-events:none}
.strings span{flex:1;position:relative}
.strings span::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:var(--w);transform:translateX(-50%);
  background:linear-gradient(90deg,#8d877a,#e4ddcc,#8d877a);opacity:.9}
.cell{z-index:3;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0}
.cell.out{background:var(--dim);cursor:default}
.dot{width:var(--dot,30px);height:var(--dot,30px);border-radius:50%;display:grid;place-items:center;
  background:var(--c);color:#14110d;font-weight:700;font-size:calc(var(--dot,30px)*.4);line-height:1;
  box-shadow:0 1px 0 rgba(0,0,0,.35);animation:pop .16s ease-out}
.dot.root{background:var(--gold);box-shadow:0 0 0 3px var(--pearl)}
.dot.octroot{background:var(--gold);opacity:.85}
.dot.ask{background:var(--pearl);box-shadow:0 0 0 3px var(--gold)}
.dot.faint{opacity:.55}
.dot.wrong{box-shadow:0 0 0 3px var(--bad)}
.dot.right{box-shadow:0 0 0 3px var(--good)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.dot,.prompt.flash{animation:none}}

.panel{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ivchip{flex:none;width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;cursor:pointer;position:relative}
.ivchip[aria-pressed="true"]{background:var(--c);color:#14110d;border-color:transparent}
.answers{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ans{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink)}
.ans::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.ans:disabled{cursor:default}
.ans.right{background:var(--c);color:#14110d;border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.ans.right::before{display:none}
.ans.wrong{color:var(--bad);border-color:var(--bad);text-decoration:line-through;opacity:.8}
.ans.dim{opacity:.4}
.ans.hear{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:8px 12px}
.ans.hear::before{display:none}
.ans.hear svg{width:18px;height:18px;flex:none}
.ans.hear span{white-space:nowrap}
.app:not(.wide) .ans.hear{padding:8px 6px;gap:4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.toolbar .tl,.toolbar .tr{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-width:0}
.toolbar .tr{margin-left:auto;flex-shrink:0;max-width:100%}
.qscore{font-size:.82rem;color:var(--muted);white-space:nowrap}
.qscore b{color:var(--ink)}
.toolbar .chip{padding:5px 12px}
.degrow{align-items:center}
.ivchip:disabled{cursor:default}
.btn.quiet{background:transparent}
.qfind{display:flex;align-items:center;gap:12px;justify-content:space-between}
.qfind .btn{flex:none;padding:10px 24px}
.actions .qnext{flex:1}
.actions{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--wood);color:var(--pearl);border-color:var(--wood)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:.78rem;color:var(--muted);margin:0}

.goal{display:flex;flex-direction:column;gap:6px}
.goal[hidden]{display:none}
.focus{display:flex;gap:6px;align-items:stretch}
.focus-sum{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;line-height:1.25}
.focus-sum b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus-sum span{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.focus .icon{height:auto;width:40px}
.seg.fmode{flex:none;flex-direction:column;border-radius:12px;padding:2px;align-items:stretch}
.seg.fmode button{border-radius:8px;padding:3px 10px;font-size:.78rem}
.goal:not(.fsong) .fs,.goal.fsong .fk{display:none}
.app.wide .goal.fsong .focus-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr);max-width:760px}
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px}
.focus-grid[hidden]{display:none}
.focus-grid label{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);min-width:0}
.fpos{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);min-width:0}
.posrow{display:flex;gap:6px;min-width:0}
.posrow select{flex:1}
.posrow .pstep{display:none;width:40px;height:auto;flex:none}
.app.wide .posrow .pstep{display:grid}
.app.wide .focus-sum,.app.wide .focus>[data-step]{display:none}
.focus-grid select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px;width:100%;min-width:0}
.dot.ghost{opacity:.28}

.dot.pass{background:var(--pearl);color:#4d453a;font-weight:600;transform:scale(.8)}
.dot.mcol{box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--mc,#E0A8EE)}
.dot.kfade{background:var(--pearl);color:transparent;transform:scale(.5);opacity:.5}
.dot.tring{background:rgba(245,247,242,.1);border:2px solid var(--c);color:var(--pearl);transform:scale(.8);box-shadow:none;font-size:calc(var(--dot,30px)*.36)}
.dot.kfade.mcol{background:var(--mc);opacity:.9;box-shadow:0 0 0 4px var(--surface),0 0 0 8px var(--mc)}
.dot.bshape{transform:scale(1.08);box-shadow:0 0 0 2px var(--surface)}
.dot.root.bshape{box-shadow:0 0 0 3px var(--pearl)}
.dot.bshape.mcol{box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--mc,#E0A8EE)}
.dot.home{box-shadow:0 0 0 3px var(--gold)}
.dot.now{transform:scale(1.2);box-shadow:0 0 0 3px var(--ink),0 0 16px 2px var(--c,var(--pearl));z-index:2;position:relative;animation:none}
.dot.nextup{outline:2px solid var(--ink);outline-offset:2px;animation:none}
.drow{display:flex;gap:6px;align-items:center}
.drow select,.transport select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 4px;min-width:0;flex:1}
.tab{overflow-x:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;scrollbar-width:thin;flex:none}
.tab::-webkit-scrollbar{display:none}
.tabin{display:inline-flex;padding:0 8px}
.tcol{display:flex;flex-direction:column;width:21px;flex:none;text-align:center;border-radius:5px}
.tcol.beat{margin-left:5px}
.tcol.bar{margin-left:9px;box-shadow:-5px 0 0 -4px var(--muted)}
.tcol span{height:12px;line-height:12px;font-size:10px}
.tcol .ln{background:linear-gradient(transparent 5.5px,var(--line) 5.5px,var(--line) 6.5px,transparent 6.5px)}
.tcol .ln b{background:var(--surface);padding:0 2px;font-weight:700}
.tcol .ln b.mx{color:var(--muted);font-weight:400}
.tcol .dg{margin-top:3px;font-weight:700}
.tcol .fg{color:var(--muted)}
.tcol .sl{font-style:normal;font-weight:500;font-size:.8em;color:var(--muted);margin-right:1px}
.tcol.now{background:color-mix(in srgb,var(--gold) 35%,transparent)}
.tcol.now .ln b{background:transparent}
.transport{display:flex;gap:6px;align-items:stretch}
.transport .icon{height:auto;width:40px;font-size:1.1rem}
.bpm{min-width:66px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:1.1rem;line-height:1.05;padding:4px 2px;cursor:pointer}
.bpm small{display:block;font-size:.62rem;color:var(--muted);font-weight:400}
.transport .play{flex:1.1;min-width:72px}
.row select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 8px;flex:none}

.side{display:contents}
/* horizontal neck (wide screens) */
.neck.h .wood{border-radius:0 6px 6px 0;background:linear-gradient(180deg,var(--wood2),var(--wood) 22%,var(--wood) 78%,var(--wood2))}
.neck.h .fret::after{left:auto;right:-1px;top:0;bottom:0;width:2px;height:auto}
.neck.h .fret.nut::after{width:7px;right:-4px;top:0;bottom:0;height:auto}
.neck.h .strings{flex-direction:column-reverse}
.neck.h .strings span::after{left:0;right:0;top:50%;bottom:auto;width:auto;height:var(--w);transform:translateY(-50%);background:linear-gradient(180deg,#8d877a,#e4ddcc,#8d877a)}
.neck .strings span.play::after{background:var(--c,var(--pearl));box-shadow:0 0 6px 2px var(--c,var(--pearl));opacity:.95}
.neck.h .inlay::after{width:14px;height:14px}
/* wide layout */
html.wide{font-size:19px}
.app.wide{max-width:none;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);
  grid-template-areas:"head head" "goal goal" "side neck" "side panel";gap:18px 32px;padding:18px 32px 22px}
.app.wide header{grid-area:head}
.app.wide h1{font-size:1.35rem}
.app.wide .side{display:flex;flex-direction:column;gap:12px;grid-area:side;min-height:0;overflow:auto}
.app.wide .side>*{flex-shrink:0}
.app.wide .focus-grid[hidden]{display:grid}
/* wide: the focus is one row under the title, its settings always open beside it */
.app.wide .goal{grid-area:goal;flex-direction:row;gap:12px;align-items:stretch}
.app.wide .focus{flex:0 0 auto;min-width:0}
.app.wide .focus-sum{cursor:default}
.app.wide .focus-grid{flex:1;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);padding:6px 10px 8px}
.app.wide .prompt{font-size:1rem;align-items:flex-start}
.app.wide .prompt .big{font-size:2.1rem}
.app.wide .neck-box{grid-area:neck;flex:none;height:clamp(240px,42vh,620px)}
.app.wide .neck{max-width:none;height:100%}
.dd{white-space:pre}
.smenu.arrw{right:auto;min-width:100%;width:max-content;max-width:min(640px,calc(100vw - 40px))}
.smenu .mi .marr{margin-left:auto;padding-left:16px;color:var(--muted);white-space:pre;letter-spacing:.04em}
.neckcap{position:absolute;top:-18px;left:48px;font-size:.75rem;color:var(--muted);z-index:2}
.sc-chart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.sc-bar{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;padding:8px 10px;display:flex;gap:10px;cursor:pointer;font:inherit;color:var(--ink);min-width:0}
.sc-bar:nth-child(4n){border-right:0}
.sc-bar span{display:flex;flex-direction:column;min-width:0}
.sc-bar b{font-size:1rem}
.sc-bar i,.sc-card i{font-style:normal;font-family:"Times New Roman",Georgia,serif;color:var(--gold);font-size:.85rem}
.sc-bar.on{background:color-mix(in srgb,var(--gold) 20%,var(--surface))}
.sc-now{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sc-card{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.sc-card.now{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.sc-card small{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sc-card b{font-size:1.1rem}.sc-card b i{margin-left:5px}
.sc-card code{font-size:.8rem}
.sc-card span{font-size:.82rem}
.tri-inv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.tri-inv dl{display:grid;grid-template-columns:92px minmax(0,1fr);row-gap:3px;margin:6px 0 0;font-size:.88rem}
.tri-inv dt{margin:0}.tri-inv dd{margin:0;color:var(--muted)}.tri-inv .on{font-weight:700;color:var(--ink)}
.tri-now{margin:0 0 10px}
.xf-top .seglab{display:none}.xf-top .sp{flex:1}
.ct-inv{display:block;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.3}
.fv .ct-inv{text-align:left}
.cmapb{margin:4px 2px 0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 10px;font:inherit;font-size:.85rem;cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap}
.cmapb .cm-f{color:var(--muted);font-size:.8rem}
.cmapb .cm-t{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:1px}
.cmapb[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cmapb[aria-pressed=true] .cm-f{color:inherit;opacity:.8}
.cmapb:hover{border-color:var(--ink)}
.neck.narrow .cmapb .cm-w{display:none}
.app.wide .neck-box.map{height:calc(clamp(240px,42vh,620px) + 68px)}
.app:not(.wide):not(.land) .neck.map{height:calc(clamp(210px,32vh,280px) + 68px)}
.app.port:not(.wide) .neck.map{height:calc(clamp(232px,35vh,300px) + 68px)}
.neck-wrap.roll{overflow-x:auto;overflow-y:hidden;display:block;scrollbar-width:thin;overscroll-behavior-x:contain}
.neck-wrap.roll .neck{max-width:none}
.app.wide .panel{grid-area:panel;min-height:0;overflow:auto;gap:12px;align-content:start}
.app.wide .row{flex-wrap:wrap;overflow:visible}
.app.wide .drow,.app.wide .transport{max-width:900px}
.app.wide .answers{grid-template-columns:repeat(var(--n),minmax(0,1fr)) auto auto}
.app.wide .answers .btn{flex:none;padding:10px 26px}
.app.wide .toolbar .pbar{position:static;margin:0;padding:0;max-width:none;background:none;align-items:center;flex-wrap:nowrap}
.app.wide .toolbar .pbar .play{flex:none;min-width:130px;padding:9px 24px}
.app.wide .toolbar .pbar .icon,.app.wide .toolbar .pbar .bpm{min-height:40px}
.app.wide .tab{padding:8px 0}
.app.wide .tcol{width:30px}
.app.wide .tcol span{height:17px;line-height:17px;font-size:13px}
.app.wide .tcol .ln{background:linear-gradient(transparent 8px,var(--line) 8px,var(--line) 9px,transparent 9px)}
.app.wide .tcol.beat{margin-left:8px}
.app.wide .tcol.bar{margin-left:14px;box-shadow:-8px 0 0 -7px var(--muted)}
.chip.tog[aria-pressed="true"]::before{content:"✓ "}
.seg{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.segw{display:inline-flex;align-items:center;gap:6px;flex:none}
.seglab{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.voice-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.voice-card[hidden]{display:none}
.howto .fold>summary{font-size:.9rem;color:var(--ink);margin-top:0}
.howto .hint{margin:4px 0 6px}
.voice-card.howto p,.panel .howto p{text-align:left}
.hrow{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;border-top:1px solid var(--line);padding:6px 0}
.hrow b{font-size:.85rem;display:block}
.hrow small{display:block;font-size:.8rem;line-height:1.4}
.hdeg{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#14110d;background:var(--c)}
.hgb{font-size:.8rem;border-left:3px solid var(--gold);padding-left:10px;margin:6px 0 0;line-height:1.4}
.panel .howto{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.vc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kc-rows{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:8px 0;font-size:.9rem}
.kc-rows dt{color:var(--muted)}.kc-rows dd{margin:0}
.cc-tab{display:grid;grid-template-columns:auto repeat(var(--n),minmax(0,1fr));gap:4px 8px;font-size:.88rem;text-align:center;margin:10px 0 6px}
.cc-tab .cc-l{text-align:left;color:var(--muted)}
.cc-tab b{border-bottom:3px solid var(--c);padding-bottom:2px}
.xtabs-card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.xtabs-card>.xch,.xtabs-card>.cb-card{border:0;background:none;margin:0}
.xtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px}
.xtabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:12px 8px;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.xtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.kc-under{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kc-mode{font-size:.88rem;margin:6px 0;text-align:left}
.voice-card .kc-mode,.voice-card .kc-under p{text-align:left;color:var(--ink);font-size:.88rem}
.voice-card .kc-diag p{text-align:center}
.fold[data-fold=vshape]{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.fold[data-fold=vshape]>summary{width:auto;font-size:.95rem;color:var(--ink)}
.fold[data-fold=vshape]>summary code{float:right;font-size:.9rem;font-weight:400}
.kc-diag{display:flex;flex-direction:column;align-items:center}.kc-diag svg{width:190px;height:auto}.kc-diag .hint{margin:0}
.vc-head b{font-size:1.25rem}
.vc-head span{color:var(--muted);font-size:.85rem}
.vc-diag{display:block;width:100%;border:0;background:none;padding:6px 0 0;cursor:pointer;color:var(--ink)}
.vc-diag svg{width:100%;max-width:190px;height:auto;display:block;margin:0 auto}
.vc-diag:hover svg{opacity:.85}
.voice-card p{margin:4px 0 0;font-size:.8rem;color:var(--muted);text-align:center}
.voice-card code{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-size:.9rem;letter-spacing:.08em;white-space:nowrap}
.dot.vc{outline:3px solid var(--gold);outline-offset:3px}
.nkey{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;margin:6px 0 4px;font-size:.8rem;line-height:1.35;text-align:left}
.nk{display:contents}
.nk-d{display:flex;flex-wrap:wrap;gap:5px;align-items:center;max-width:104px}
.nk .dot{--dot:28px;animation:none;flex:none}
.nk-bar{display:inline-block;width:12px;height:30px;border-radius:999px;background:#2a1d12;box-shadow:0 0 0 2px var(--pearl);margin:0 8px}
.voice-card .nkey+p.hint,.nkey+p.hint,.voice-card p.vc-tap{text-align:left;margin-top:2px}

.dot.outk{border:2px dashed #14110d}
.dot.pick{outline:3px solid #F5F7F2;outline-offset:3px;position:relative;z-index:2}
.dot.dim{opacity:.5}
.dot.ghost.dim{opacity:.18}
.dot.under{opacity:.2}
.dot.ghost.under{opacity:.1}
.exlines{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible}
.exlines line{stroke:#F5F7F2;stroke-width:3;stroke-linecap:round;opacity:.8}
.xnote{display:flex;flex-direction:column;gap:8px;font-size:.84rem;line-height:1.45;text-align:left}
.xnote p{margin:0;text-align:left;color:var(--ink);font-size:.84rem}
.xnote .vc-head{align-items:center}
.xnote .vc-head .qh{color:var(--ink);font-size:.95rem;line-height:1.35}
.xnote .vc-head b{font-size:1.6rem;line-height:1}
.xnote .hdeg{width:auto;min-width:28px;padding:0 5px;border-radius:14px;box-sizing:border-box}
.xn-lab{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:2px 0 1px}
.xn-pent{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 9px}
.xn-list span{display:block}
.xch{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.xch-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.xch-top b{font-size:.95rem}
.xch-top .swl{margin:2px 0 0;flex:none}
.xshapes{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.xshape{align-items:stretch;text-align:left;padding:6px 8px 8px;gap:3px;font-size:.78rem}
.xshape svg{width:118px;max-width:100%;height:auto;align-self:center}
.xshape b{font-size:.92rem}
.xshape b .rn{font-family:"Times New Roman",Georgia,serif;color:var(--gold);font-weight:700;margin-left:4px}
.xshape .xrole{display:flex;gap:6px;align-items:center;justify-content:center;color:var(--ink)}
.xshape .xrole .hdeg{width:auto;min-width:22px;height:22px;padding:0 4px;border-radius:11px;font-size:.66rem;box-sizing:border-box;flex:none}
.xshape .xnone{color:var(--muted);padding:8px 0}
.dot.fing{font-size:calc(var(--dot,30px)*.5);font-weight:800}
.dot.openv{background:transparent;box-shadow:inset 0 0 0 3px var(--c);color:var(--ink)}
.dot.openv.now{box-shadow:inset 0 0 0 3px var(--c),0 0 16px 2px var(--c)}
.dot.mute{background:transparent;box-shadow:none;color:var(--ink);font-size:calc(var(--dot,30px)*.62);font-weight:400;opacity:.8}
.dot.fadeprev,.barre.fadeprev{opacity:.35}
.dot.nextv{background:#2a1d12;color:var(--pearl);box-shadow:0 0 0 3px var(--pearl)}
.dot.nexto{outline:3px solid #2a1d12;outline-offset:1px}
.dot.blank{background:transparent;box-shadow:none}
.nexttag{position:absolute;top:8px;right:10px;z-index:6;border:0;border-radius:999px;padding:5px 14px;font:inherit;font-weight:700;font-size:.85rem;background:var(--pearl);color:#14110d;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.nexttag[aria-pressed="false"]{background:rgba(239,231,214,.82);font-weight:600}
.barre{z-index:2;pointer-events:none;display:grid;place-items:center}
.barre i{display:block;border-radius:999px;background:#2a1d12;box-shadow:0 0 0 2px var(--pearl);opacity:.9}
.neck.h .barre i{width:calc(var(--dot,30px)*.62);height:calc(100% - var(--dot,30px)*.3)}
.neck:not(.h) .barre i{height:calc(var(--dot,30px)*.62);width:calc(100% - var(--dot,30px)*.3)}
.ex-song{display:flex;flex-direction:column;gap:10px}
.ex-song p{margin:0;font-size:.86rem;line-height:1.45}
.ex-sum{color:var(--muted)}.ex-sum b{color:var(--ink)}
.cchip.outk{border-style:dashed;border-color:var(--bad)}
.cchip.ex-ch small{font-family:"Times New Roman",Georgia,serif;font-size:.84rem}
.ex-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ex-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ex-name{font-size:1.3rem}
.ex-head .rn{font-family:"Times New Roman",Georgia,serif;color:var(--muted);font-size:1.05rem}
.ex-tag{margin-left:auto;font-size:.74rem;color:var(--good)}.ex-tag.out{color:var(--bad)}
.exns{display:flex;flex-wrap:wrap;gap:6px}
.exn{display:flex;flex-direction:column;border-left:4px solid var(--c);padding:1px 8px;line-height:1.2}
.exn small{font-size:.72rem;color:var(--muted)}
.exn.outk{border-left-style:dashed}
.ex-play{align-items:center}.ex-play code{font-size:.9rem;letter-spacing:.06em;white-space:nowrap}
.ex-parts{display:flex;flex-direction:column;gap:6px}
.ex-part{display:flex;flex-direction:column;gap:3px;min-width:0}
.app.wide .sh-bars.ex-bars{display:flex;flex-wrap:wrap}
.vc-formula{margin-top:8px}
.vc-formula>div{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-width:2.3em;text-align:center;padding:4px 8px;border-radius:8px;background:var(--c);color:#14110d;font-weight:700;font-size:.95rem}
.fchip.off{background:none;color:var(--muted);box-shadow:inset 0 0 0 2px var(--c);text-decoration:line-through}
.voice-card .vc-formula p{text-align:left;margin-top:6px}
.vc-head b.rn{font-family:"Times New Roman",Georgia,serif;font-size:1.35rem;color:var(--gold);font-weight:700}
.rn-strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.rn-strip button{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 7px;cursor:pointer;font-family:"Times New Roman",Georgia,serif;font-size:.95rem;color:var(--muted)}
.rn-strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.voice-card p.vc-shape{text-align:left;margin-top:8px}
.tcol.chordcol{width:auto;min-width:21px;padding:0 3px;background:color-mix(in srgb,var(--gold) 12%,transparent)}
.tcol.chordcol.now{background:color-mix(in srgb,var(--gold) 40%,transparent)}
.tcol.chordcol .fg{font-size:9px}
.tcol.chordcol,.app.wide .tcol.chordcol{width:max-content;padding:0 5px 0 3px;white-space:nowrap}
.tcol.strumcol .dg{font-size:13px;color:var(--ink)}
.tcol.strumcol.ghost .dg{opacity:.22;font-weight:400}
.tcol.strumcol.acc .dg{color:var(--gold)}
.app.wide .tcol.strumcol .dg{font-size:16px}

/* loop a section of the tab: two gold edges you drag, the rest of the tab fades */
.tabin{position:relative}
.lp{position:absolute;top:0;bottom:0;left:0;width:100%;pointer-events:none;z-index:2}
.lp-shade{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--surface) 72%,transparent);
  background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px)}
.lp-band{position:absolute;top:0;bottom:0;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent)}
.lp.off .lp-band{border-color:transparent;background:none}
.lp-h{position:absolute;top:-2px;bottom:-2px;width:22px;margin-left:-11px;pointer-events:auto;cursor:ew-resize;touch-action:none;display:grid;place-items:center}
.lp-h::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;border-radius:2px;background:var(--gold)}
.lp-h::after{content:"";position:relative;width:14px;height:30px;border-radius:7px;background:var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.35);
  background-image:linear-gradient(90deg,transparent 4px,rgba(20,17,13,.45) 4px 5px,transparent 5px 9px,rgba(20,17,13,.45) 9px 10px,transparent 10px)}
.lp.off .lp-h{opacity:.45}
.lp-h:hover,.lp-h.drag,.lp-h:focus-visible{opacity:1!important;outline:none}
.lp-h:focus-visible::after{box-shadow:0 0 0 3px var(--ink)}
.lp-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 0;font-size:.8rem;color:var(--muted);min-height:28px}
.lp-note b{color:var(--ink)}
.lp-note .chip{padding:3px 11px;font-size:.78rem}
.tab.lpdrag{cursor:ew-resize;user-select:none}
#tip{position:fixed;left:0;top:0;z-index:1000;max-width:290px;background:var(--ink);color:var(--bg);font-size:.8rem;line-height:1.4;
  padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.28)}
#tip.on{opacity:1}
#tip b{font-weight:700}
@media (prefers-reduced-motion: reduce){#tip{transition:none}}
.term{border-bottom:1px dotted currentColor;cursor:help;text-decoration:none}
.term:focus-visible{outline:2px solid var(--gold);outline-offset:1px;border-radius:2px}
.st-lab{margin:8px 0 4px!important;color:var(--muted);font-size:.8rem;text-align:left!important}
.stack{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px}
.st-deg{font-weight:700;font-size:1rem;min-width:1.4em;text-align:center}
.st-step{display:inline-flex;flex-direction:column;align-items:center;font-size:.78rem;color:var(--muted);padding:0 4px;position:relative}
.st-step::after{content:"→";font-size:.9rem;line-height:.8}
.st-step small{font-size:.65rem;order:2}
#gloss{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
#gloss[hidden]{display:none}
.gl-panel{background:var(--surface);color:var(--ink);border-radius:16px;width:min(720px,100%);max-height:calc(100% - 24px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.gl-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.gl-top h2{margin:0;font-size:1.15rem}
.gl-body{overflow:auto;padding:0 16px 16px}
.gl-body h3{font-size:.8rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
.gl-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px}
.gl-row>div{flex:1}
.gl-row p{margin:3px 0 0;font-size:.88rem;line-height:1.45}
.gl-row.hl{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.gl-hs{font-size:.75rem;color:var(--muted)}

/* strum grid with counting under each step (Drill progressions) */
.rgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px 0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;flex:none}
.rstep{border:0;background:none;padding:2px 0 3px;margin:0 1px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.rstep.beat{border-left:2px solid var(--line);border-radius:0 7px 7px 0;margin-left:2px}
.rstep:first-child{border-left:0}
.rstep b{font-size:1.35rem;line-height:1.2;height:1.2em;font-weight:700}
.rstep.ghost b{opacity:.2;font-weight:400}
.rstep.mute b{color:var(--bad)}
.rstep.acc b{color:var(--gold)}
.rstep small{font-size:.72rem;color:var(--muted);font-weight:600}
.rstep.onbeat small{color:var(--ink)}
.rstep.now{background:color-mix(in srgb,var(--gold) 38%,transparent)}
.rchords{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rchords select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 4px}
.rchords select:disabled{opacity:.4}
.rchords .hint{flex:1;min-width:10em}
.rchords .now{outline:2px solid var(--gold)}
.app.wide .rgrid{padding:10px 8px}
.app.wide .modes button{padding:7px 16px;font-size:.85rem;white-space:nowrap}
.app.wide header{gap:16px}
.app.wide h1{flex:none}
.app.wide .stats{flex:1}
.modes button{white-space:nowrap}
.app:not(.wide) .modes button{font-size:.8rem;padding:8px 3px}
/* practice mode: the log takes the neck's place */
.app.m-practice .neck-box{display:none!important}
.app.m-practice .panel{flex:1;min-height:0;overflow:auto}
.app.wide.m-practice{grid-template-areas:"head head" "goal goal" "side panel" "side panel"}
.app.land.m-practice{grid-template-areas:"modes head" "goal goal" "prompt prompt" "panel panel"}
.app.wide.m-practice .panel>*{max-width:760px}
.lg-sum{margin:0;font-size:.9rem;line-height:1.4}
.path{display:flex;flex-direction:column;gap:14px}
.pnext{border:2px solid var(--gold);background:var(--surface);border-radius:14px;padding:4px 14px 14px;display:flex;flex-direction:column;gap:6px}
.pnext>b{font-size:1.15rem}
.pnext p{margin:0;font-size:.9rem;line-height:1.45}
.pnext .btn{flex:none;align-self:flex-start;padding:10px 22px}
.pstage h3{margin:0 0 6px;font-size:1rem}
.pstage h3 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:4px}
.psteps{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.pstep{width:100%;display:flex;gap:10px;align-items:center;text-align:left;font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer}
.pstep:hover{border-color:var(--muted)}
.pmark{flex:none;width:1.6em;height:1.6em;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.pstep.done .pmark{background:var(--good);border-color:var(--good);color:#fff}
.pstep.next{border-color:var(--gold)}
.pstep.next .pmark{border-color:var(--gold);color:var(--gold)}
.ptext{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.9rem;line-height:1.35}
.ptext small{color:var(--muted);font-size:.8rem}
.ptext a{color:inherit}
.stars{display:inline-flex}
.stars button{border:0;background:none;font-size:1.25rem;padding:0 2px;cursor:pointer;color:var(--line)}
.stars button[aria-pressed="true"]{color:var(--gold)}
.psync{border-top:1px solid var(--line);padding-top:8px;font-size:.9rem}
.fold>summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.82rem;text-align:left;margin-top:6px;width:max-content;max-width:100%}
.fold[open]>summary{margin-bottom:2px}
.psync summary{cursor:pointer;color:var(--muted);font-weight:600}
.psync[open]{display:flex;flex-direction:column;gap:8px}
.pathnote{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--gold);border-radius:999px;padding:3px 3px 3px 12px;font-size:.8rem;background:color-mix(in srgb,var(--gold) 10%,var(--surface));flex:none}
.pathnote>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pathnote .chip{flex:none;padding:4px 12px}
.lg-add{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:4px 10px 10px}
.lg-add input,.lg-add textarea,.app .drow input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.voic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.voic label{display:flex;align-items:center;gap:8px;font-size:.88rem}
.voic b{min-width:3.6em}
.voic input{flex:1;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.lg-add .drow input[type=number]{width:5.5em;flex:none}
.drow input#lgToken{flex:1}
.lg-sum a,.lg-steps a{color:inherit}
.lg-steps{margin:0;padding-left:1.3em;font-size:.88rem;line-height:1.45}
.app.wide .rstep b{font-size:1.7rem}

/* landscape phone: horizontal neck on the left, controls in a scrolling column on the right */
html.land{font-size:15px}
.app.land{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,40%);
  grid-template-rows:auto auto auto minmax(0,1fr);
  grid-template-areas:"modes head" "neck goal" "neck prompt" "neck panel";
  gap:6px 12px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.app.land header{grid-area:head;gap:6px}
.app.land h1{display:none}
.app.land .stats{flex:1;text-align:left;font-size:.72rem}
.app.land .icon{width:32px;height:32px}
.app.land .modes{grid-area:modes}
.app.land .modes button{padding:6px 4px}
.app.land .goal{grid-area:goal}
.app.land .focus-sum{padding:4px 8px}
.app.land .focus-grid{padding:6px 8px 8px}
.app.land .prompt{grid-area:prompt;font-size:.8rem;min-height:0}
.app.land .prompt .big{font-size:1.15rem}
.app.land .prompt .sub{font-size:.72rem}
.app.land .neck-box{grid-area:neck;min-height:0}
.app.land .neck{max-width:none;height:100%}
.app.land .panel{grid-area:panel;min-height:0;overflow:auto;gap:6px;padding-bottom:4px}
.app.land .panel>*{flex-shrink:0}
.app.land .transport .icon,.app.land .bpm{height:auto}
.app.land .btn{padding:8px}
.app.land .ans{padding:7px 0}

/* Drill: the song sheet (what you play), the strum card under the neck, and the practice bar */

.sh-title{font:inherit;font-weight:700;font-size:1.05rem;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--muted);border-radius:0;padding:2px 0;max-width:100%;min-width:0;cursor:pointer;text-overflow:ellipsis}

button.bar{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 9px;cursor:pointer}

button.bar.split{border-style:dashed}
button.bar[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--surface))}
.app.wide .sh-bars{display:grid;grid-template-columns:1fr 1fr;overflow:visible}

.strum-card{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;flex:none}

.sc-top{align-items:center}

.pbar{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;position:sticky;bottom:0;z-index:4;background:var(--bg);padding:6px 0 2px;margin-top:auto;flex:none}

.pbar .chip{align-self:center}
.tsel{font:inherit;font-size:.85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px;align-self:center;flex:none;min-width:0}
.tleft{align-self:center;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.tleft:empty{display:none}
.pcount{flex:1;min-width:0;align-self:center;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

.app.wide .pbar.pin{position:sticky;bottom:0;margin-top:auto;max-width:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;align-items:center;gap:10px 16px}

.app.wide .pbar.pin select{width:auto;max-width:120px;padding:4px 6px;font-size:.85rem}
.app.wide .pbar.pin .pcount{font-size:.88rem}
.pc2{display:inline-block;line-height:1.25;text-align:right}
.app.wide .pbar.pin .sp{flex:0}
.app.wide .pbar.pin .pcount{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:right}

.app.wide.m-drill .panel{display:flex;flex-direction:column}
.app.land .song-sheet{grid-area:prompt;padding:6px 8px;gap:5px}

/* Songs tab */
.app.wide.m-songs{grid-template-areas:"head head" "goal goal" "panel panel" "panel panel"}

.songs{display:flex;flex-direction:column;gap:12px}

.se-head,.se-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}

.tempo-in{width:5.5em}

.se-go{flex:0 0 auto;padding:10px 20px}
.se-link{color:inherit;font-size:.85rem;align-self:center}
.sbox{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.sb-top{display:flex;align-items:baseline;gap:10px}
.sb-top small{color:var(--muted);font-size:.78rem}
.sb-top .chip{margin-left:auto;padding:4px 10px}
.pname{font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--muted);padding:1px 0;width:8em;min-width:0}
.sbox textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;resize:vertical}
.hint.bad{color:var(--bad)}

.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 10px;cursor:pointer;line-height:1.2}
.cchip small{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;color:var(--muted);white-space:nowrap}
.cchip.own small{color:color-mix(in srgb,var(--gold) 72%,var(--ink));font-weight:700}

.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.shape{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;cursor:pointer;color:var(--ink);font-size:.72rem;text-align:center}
.shape svg{width:100%;max-width:150px;height:auto}

.shape span{color:var(--muted)}

/* Drill settings sheet */
.sets-wrap{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.sets{background:var(--surface);color:var(--ink);border-radius:16px;width:min(460px,100%);max-height:calc(100% - 24px);overflow:auto;padding:12px 16px 16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}

  appearance:none;-webkit-appearance:none;text-overflow:ellipsis;cursor:pointer;

.sets-top small{color:var(--muted);font-size:.8rem;font-weight:400}
.bh{display:flex;align-items:center;gap:8px;min-width:0}
.swl{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);white-space:nowrap}

span.blab{cursor:default}

/* a desktop builder row: its label, then a dropdown showing the pick */
.dd{font:inherit;font-size:.92rem;text-align:left;color:var(--ink);background-color:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 30px 7px 10px;min-width:0;width:100%;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.dd:hover{border-color:var(--muted)}

.smenu.cols2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 10px;max-height:min(70vh,560px);overflow:auto}
.eline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.eline .btn{flex:none;padding:8px 16px}
.eline .tsel{font-size:.8rem;padding:4px 8px}
.sumc{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 1px}
.chip.sm{padding:2px 9px;font-size:.74rem;cursor:default;background:color-mix(in srgb,var(--ink) 5%,var(--surface));white-space:normal}
.exi.open{grid-template-columns:auto minmax(0,1fr);border:2px solid var(--gold);align-items:start}
/* one chord tile: Songs, Drill with a song, and Explore with a song */

.fv-h{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left}

.ftags{display:flex;gap:6px;flex-wrap:wrap;min-height:20px}

.btag{font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ct-h .rn{font-family:"Times New Roman",Georgia,serif;color:var(--gold);font-weight:700;margin-left:5px;font-size:.92rem}
.ct-h code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;color:var(--muted);white-space:nowrap}
.cchip.own .ct-h code,button.bar.own .ct-h code{color:color-mix(in srgb,var(--gold) 72%,var(--ink));font-weight:700}
.ctile .ct-out{font-size:.72rem;color:var(--bad);font-family:inherit}
.ctile .xnone{color:var(--muted);font-size:.78rem;padding:14px 0;text-align:center}
.app.wide .cchips:has(.ctile){display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ex-side .vc-head .rn{font-family:"Times New Roman",Georgia,serif;color:var(--gold);font-weight:700;font-size:1.2rem}
.ex-side .ex-play{align-items:center;gap:10px}
.ex-side .ex-tag{margin:0}
.exi .tx.ed{gap:10px}
/* the chord builder: three steps, steps 2 and 3 slide shut like drawers and show their choices as pills */
.cb{display:flex;flex-direction:column;gap:8px;min-width:0}
.cb h3{font-size:.95rem;margin:0;font-weight:700}
.cb-steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cb-step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-size:.84rem}
.cb-step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;background:var(--line);color:var(--ink)}
.cb-step b{font-weight:600}
.cb-step small{color:var(--muted)}
.cb-step.done .n{background:var(--good);color:#fff}
.cb-step.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cb-step.on .n{background:var(--gold);color:#14110d}
.cb-sep{color:var(--muted)}
.cb-panel{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cb-ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb-ph .hint{margin:0 0 0 auto}
.cb-root{display:flex;gap:6px;align-items:center}
.cb-rootsel{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:3px 8px}
.cb-rlist{display:flex;gap:6px;flex-wrap:wrap}
.cb-neck{overflow-x:auto;scrollbar-width:thin}
.cb-nsvg{display:block;width:100%;min-width:560px;height:auto}
.cb-ring{cursor:pointer}
.cb-ring circle{fill:rgba(233,169,58,.25);stroke:var(--gold);stroke-width:2.5;stroke-dasharray:4 3}
.cb-ring text{fill:var(--pearl)}
.cb-ring:hover circle,.cb-ring:focus-visible circle{fill:rgba(233,169,58,.55)}
.cb-ring:focus-visible{outline:none}
.cb-ring.on circle{fill:var(--gold);stroke:var(--pearl);stroke-dasharray:none}
.cb-ring.on text{fill:#14110d}
.cb-drawer{gap:0}
.cb-drawer.off{opacity:.5}
.cb-drawer:not(.shut) .cb-dh{margin-bottom:8px}
.cb-drawer.shut{padding-block:7px}
.cb-dh{display:flex;align-items:center;gap:10px;min-width:0}
.cb-dh .hint{margin:0 0 0 auto}
.cb-fold{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit;flex:none;max-width:62%}
.cb-fold h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-fold .short,.cb-drawer.shut .cb-fold h3:not(.short){display:none}
.cb-drawer.shut .cb-fold .short{display:block}
.cb-chev{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .25s}
.cb-chev::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
.cb-drawer.shut .cb-chev{transform:rotate(-90deg)}
.cb-peek{display:none;flex:1;min-width:0;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:2px}
.cb-drawer.shut .cb-peek{display:flex}
.cb-drawer.shut .cb-dh>.hint{display:none}
.cb-peek .chip{padding:5px 11px;display:inline-flex;align-items:baseline;gap:6px}
.cb-peek .chip code{font-size:.78rem}
.cb-peek .chip small{font-size:.72rem;opacity:.8}
.cb-peek .chip[aria-pressed="true"]{order:-1}
.cb-dbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease}
.cb-drawer.shut .cb-dbody{grid-template-rows:0fr}
.cb-dinner{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.cb-none{font-size:.84rem;color:var(--muted);margin:0;padding:4px 0}
.cb-car{display:flex;align-items:center;gap:6px}
.cb-arr{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1rem;color:var(--ink)}
.cb-track{display:flex;gap:8px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:thin;padding:2px 2px 6px;flex:1;min-width:0}
.cb-cc,.cb-vc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;cursor:pointer;color:var(--ink)}
.cb-cc{flex:none;width:128px}
.cb-cc b{font-size:1rem}
.cb-cc small,.cb-vc small{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.3}
.cb-cc svg,.cb-vc svg{width:100%;max-width:124px;height:auto;display:block}
.cb-cc[aria-pressed="true"],.cb-vc[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.cb-vs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.cb-vc code{font-size:.78rem}
.cb-rn{font-family:"Times New Roman",Georgia,serif;color:var(--gold);font-weight:700;font-size:.95rem;line-height:1}
.cb-rn.big{font-size:1.3rem}
.cb-res{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cb-nm{font-size:1.5rem;font-weight:700}
.cb-tones{display:flex;flex-wrap:wrap;gap:6px}
.cb-tone{display:flex;flex-direction:column;border-left:4px solid var(--c);padding:1px 8px;line-height:1.2}
.cb-tone small{font-size:.72rem;color:var(--muted)}
.cb-hear{flex:none;margin-left:auto;padding:8px 16px}
.cb-labs{display:flex;align-items:center;gap:4px}
.cb-labs .chip{padding:4px 10px}
.cb-card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cb-card .xch-top .chip{flex:none}
.dot.rpick{background:rgba(233,169,58,.3);border:3px dashed var(--gold);color:var(--pearl);cursor:pointer}
.dot.rpick:hover{background:rgba(233,169,58,.6)}
@media (prefers-reduced-motion:reduce){.cb-dbody,.cb-chev{transition:none}.cb-track{scroll-behavior:auto}}
/* the progression builder pop-up */
#cpm{position:fixed;inset:0;z-index:850;background:rgba(10,14,12,.5);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
#cpm[hidden]{display:none}
.cpm-panel{background:var(--surface);color:var(--ink);border-radius:16px;width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.cpm-head{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.cpm-head>div{flex:1;min-width:0}
.cpm-head h2{margin:0;font-size:1.1rem}
.cpm-head .hint{margin:2px 0 0}
.cpm-body{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.cpm-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.cpm-body>*{flex:none}
.cpm-f.cpm-type input{font-size:18px;font-weight:600;padding:9px 12px;border:2px solid var(--gold);background:var(--surface)}
.cpm-body>.hint{margin:-4px 0 0}
.cpm-main{display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--ink) 3%,var(--surface))}
.cpm-now{margin:0;font-size:.95rem}
.cpm-f{display:flex;flex-direction:column;gap:4px}
.cpm-f input,.cpm-f select{font:inherit;font-size:15px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.cpm-bars{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cpm-bar{flex:0 0 auto;min-width:200px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"g no x" "g ch x";align-items:center;column-gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 6px 6px 8px}
.cpm-bar.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.cpm-bar.now{box-shadow:0 0 0 3px var(--ink)}
.cpm-bar .grip{grid-area:g;color:var(--muted);cursor:grab;letter-spacing:-2px;user-select:none}
.cpm-bar .no{grid-area:no;font-size:.72rem;color:var(--muted)}
.cpm-chs{grid-area:ch;display:flex;gap:10px}
.cpm-ch{border:0;background:none;padding:2px 4px;border-radius:7px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column}
.cpm-ch[aria-pressed=true]{background:color-mix(in srgb,var(--gold) 30%,var(--surface))}
.cpm-ch .nm{font-weight:700}
.cpm-ch .nm i{font-style:normal;font-family:"Times New Roman",Georgia,serif;color:var(--gold);margin-left:5px}
.cpm-ch code{font-size:.74rem;color:var(--muted)}
.cpm-bar .x{grid-area:x;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.05rem;padding:0 6px}
.cpm-add{flex:0 0 auto;border:1px dashed var(--line);background:none;border-radius:10px;padding:7px 14px;color:var(--muted);cursor:pointer}
.cpm-info{display:flex;flex-direction:column;font-size:.9rem;line-height:1.3}
.cpm-info small{color:var(--muted)}
.cpm-name{flex-direction:row;align-items:center;gap:8px}
.cpm-foot .play{min-width:110px}
.cpm-foot{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line)}
.cpm-foot .sp{flex:1}
.cpm-foot .btn{flex:none;padding:9px 18px}
.cpm-foot .btn[disabled]{opacity:.5;cursor:default}
.sh-edit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh-edit .hint{margin:0}
.chip.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.bar-ed{display:none;font-size:.68rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--surface);align-self:flex-start;cursor:pointer}
button.bar:hover .bar-ed,button.bar:focus-visible .bar-ed,button.bar[aria-pressed="true"] .bar-ed{display:inline-block}
.bar-ed:hover{color:var(--ink);border-color:var(--gold)}
@media (max-width:860px){.cpm-body{grid-template-columns:1fr}.cpm-side{position:static}.cb-ph .hint{margin-left:0}}
/* phone upright: the page scrolls as one, the tabs sit in a bar at the bottom and Drill's play bar stays just above them */
html.port,html.port body{height:auto}
.app.port{height:auto;min-height:100vh;min-height:100dvh;--tabh:calc(52px + env(safe-area-inset-bottom,0px));padding-bottom:calc(var(--tabh) + var(--pbarh,0px) + 14px)}
.app.port .panel{overflow:visible!important;flex:none!important;min-height:0}

.app.port header .icon{width:34px;height:34px}

.app:not(.wide) .fnum{font-size:.8rem}
.app.port .prompt{margin-bottom:4px}
/* Explore: each label in one column with its switch beside it; all the degree chips fit on one row */
.app.port .xtool{flex-direction:column;align-items:stretch;gap:6px}
.app.port .xtool .tl,.app.port .xtool .tr{flex-direction:column;align-items:stretch;gap:6px;margin-left:0}
.app.port .xtool .segw{display:flex;align-items:center;gap:8px}

.app:not(.wide) .xch-top{flex-direction:column;gap:6px}
.app:not(.wide) .xch-top .xsw{display:flex;flex-wrap:wrap;gap:6px 16px}
.app:not(.wide) .xshapes{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;padding-bottom:4px}

.app.port .exi:not(.edit):not(.open){grid-template-columns:auto minmax(0,1fr) auto;row-gap:4px;align-items:center}

.app.port .exi:not(.edit):not(.open) .tx>*{grid-column:2/-1}

.app.port .exi:not(.edit):not(.open)>.mk{grid-row:1}

  if(st.playing&&met.endAt) return `${mmss(Math.min(Math.ceil(met.tlen),Math.ceil(Math.max(0,met.endAt-ac.currentTime))))} left`;
  if(st.playing&&met.tlen) return `${mmss(met.tlen)} left`;

function startMet(fromK=0){

function pauseMet(){

function togglePlay(){

function schedule(){
  if(D.line==='prog') return pschedule();

  while(met.next<ac.currentTime+0.12&&!met.done){
    const i=met.step, t=met.next;
    const beatNo=Math.floor(i/sub), beat=((i%sub)+sub)%sub===0, bar=beat&&((beatNo%4)+4)%4===0;
    if(D.click||i<0){ if(beat) click(t,bar?1760:1175,bar?0.4:0.25); else if(D.click&&sub>1) click(t,880,0.06); }
    if(i<0){ if(beat) met.queue.push({t,count:beatNo+5}); }
    else{
      if(met.tlen&&!met.endAt) met.endAt=t+met.tlen;
      const late=met.endAt&&t>=met.endAt-0.001; if(late&&!met.ending){met.ending=true; met.queue.push({t,ending:true});}
      if(met.k>=loopEnd()){ if(late){timeUp(t); return;} passEnd(t); } // time's up: the run (or the loop) plays to its end

}
function passEnd(t){

    met.k=st.loop.a;

    return;

  if(D.where==='cycle'&&cycleNext()){fresh=shape=true;}
  if(D.line==='prog'&&D.plan==='triads'&&D.tinv==='turn'){st.tturn=((st.tturn||0)+1)%3; refresh(); fresh=shape=true;} // the next inversion up the neck
  if(fresh){st.seq=genSeq(); met.queue.push({t,newSeq:true,shape});}

}
function cycleShapes(){return cur.pos.map(p=>p.lo);} // the shapes each shape in turn goes through: every box
function cycleNext(){
  const S=cycleShapes(); if(S.length<2) return false;
  F.pos=S[(S.indexOf(F.pos)+1)%S.length]; refresh(); save();

  return true;
}
function pschedule(){
  // progressions: a one-bar count-in of four clicks, then each step at its own bar's grid (strum bars 8 or 16, arpeggio bars 4 × notes per beat)
  while(met.next<ac.currentTime+0.12&&!met.done){
    const t0=met.next;
    if(met.step<0){
      click(t0,met.step===-4?1760:1175,met.step===-4?0.4:0.25); met.queue.push({t:t0,count:met.step+5});
      met.next+=60/saved.bpm; met.step++; continue;
    }
    if(met.tlen&&!met.endAt) met.endAt=t0+met.tlen;
    if(met.endAt&&t0>=met.endAt-0.001&&!met.ending){met.ending=true; met.queue.push({t:t0,ending:true});}
    if(met.k>=loopEnd()){ if(met.ending){timeUp(t0); return;} passEnd(t0); }

    if(n.k%per===0&&D.click) click(t,n.k===0?1760:1175,n.k===0?0.4:0.25);
    if(D.notes){
      const v=cur.prog[n.ci]&&cur.prog[n.ci].voicing;
      if(n.chord){ if(n.strum!=='.'&&v) rstrum(t,n.v||v,n.down??n.k%2===0,n.strum,dur); }

function draw(){
  const now=ac.currentTime; let changed=false, newTab=false, newChord=false, newShape=false;
  while(met.queue.length&&met.queue[0].t<=now){
    const e=met.queue.shift(); changed=true;
    if(e.end){const len=saved.timer||0; stopMet(); st.timeUp=len||1; render(); return;}
    if('count' in e) st.count=e.count;
    if(e.newSeq) newTab=true;
    if(e.shape) newShape=true;
    if(e.bpm){const b=document.getElementById('bpmVal'); if(b) b.textContent=saved.bpm; save();}
    if('k' in e){st.count=0; st.idx=e.k;
      const n=st.seq[e.k]; if(cur.prog&&n&&n.ci!==cur.pci){setProgChord(n.ci); newChord=true;}}
  }
  if(newShape){fillSelects(); render(); updateTab(); met.raf=requestAnimationFrame(draw); return;} // the next shape: everything that names the box
  updTimer();
  if(changed){ if(newTab) renderTab(); renderBoard(); renderPrompt(); updateTab(); updateRGrid();
    if(newChord){renderVoice(); markProgChord();} }
  met.raf=requestAnimationFrame(draw);

const RPAT={}; RPATS.forEach(([g,list])=>list.forEach(([id,name,res,steps,swing])=>RPAT[id]={id,name,res,steps,swing:!!swing,group:g}));

function mergeLogs(a,b){

    const x=sessions[s.id];
    if(!x){sessions[s.id]={...s,entries:s.entries.map(e=>({...e}))}; return;}
    x.start=Math.min(x.start,s.start); x.end=Math.max(x.end,s.end);
    s.entries.forEach(e=>{const o=x.entries.find(o=>o.id===e.id);
      if(!o) x.entries.push({...e});
      else if((e.asked||0)>(o.asked||0)||(e.clean&&!o.clean)||(e.secs||0)>(o.secs||0)) Object.assign(o,e);});

}

  if(k==='wpos'||k==='ekey'){if(st.edit) editPick(k,v); return;}

  ['quality','Major, minor, perfect','2nds, 3rds, 6ths, and 7ths come in major and minor versions. Minor is one half step smaller. 4ths, 5ths, and octaves are called perfect. Augmented (♯) is a half step wider than major or perfect; diminished (♭, or ♭♭ for a 7th) is a half step narrower than minor or perfect.'],

// The app stays one page, but each tab, the song open in Songs, the settings sheet and the glossary get an entry in the browser's history, so Back returns to the previous screen.
const exKey=()=>st.ex?`${st.ex.rid||''}/${st.ex.uid||st.ex.ex}`:null;
function navNow(){return {mode:st.mode,song:st.mode==='songs'?(st.newSong?'+':st.song||null):null,sheet:!!st.sheet&&st.mode==='drill',gloss:!document.getElementById('gloss').hidden,ex:exKey()};}
const navKey=s=>s?[s.mode,s.song,s.sheet,s.gloss,s.ex||''].join('|'):'';
function navSync(){
  if(st.navBusy||!window.history||!history.replaceState) return;
  const now=navNow(), hs=history.state, was=hs&&hs.fm;
  if(!was){history.replaceState({fm:now},''); return;} // the entry the page loaded into
  if(navKey(now)===navKey(was)) return;
  // closing the sheet or the glossary steps back over the entry that opening it added
  if(hs.pushed&&(was.sheet||was.gloss)&&navKey({...was,sheet:now.sheet,gloss:now.gloss})===navKey(now)){history.back(); return;}
  history.pushState({fm:now,pushed:true},'');
}
addEventListener('popstate',e=>{
  const s=e.state&&e.state.fm; if(!s) return;
  st.navBusy=true;
  try{
    if(!s.gloss&&!document.getElementById('gloss').hidden) closeGloss();
    if((s.ex||null)!==exKey()){ // back into an exercise, or out of one
      const [r_,u]=(s.ex||'/').split('/'), r=r_&&LOG.routines[r_], k=r?r.items.findIndex(x=>x.uid===u):-1;
      if(k>=0) exGo(r,k); else if(!r_&&exOf(u)) exStart({ex:u}); else st.ex=null;
    }
    if(s.mode!==st.mode) setMode(s.mode);
    if(s.mode==='songs'){
      st.newSong=s.song==='+'; st.vpick=null;
      if(s.song&&s.song!=='+'&&LOG.skills[s.song]){st.song=s.song; if(focusSong()&&saved.fsong!==s.song) setFocusSong(s.song);}
    }
    st.sheet=s.sheet&&st.mode==='drill'; render();
    if(s.gloss&&document.getElementById('gloss').hidden) openGloss();
  }finally{st.navBusy=false;}
  const now=navNow(); if(navKey(now)!==navKey(s)) history.replaceState({...e.state,fm:now},''); // the song it named is gone
});

function formulaText(c){return c.rel.map(r=>chordIv(c,r)[0]).join(' ');}
function degreeText(p){
  const ivK=ivOf(p,cur.key), n=noteName(pc(p.s,p.f));
  let t=`<b>${n}</b>: ${lab(ivK)[1]} of ${keyName()}`;
  if(!cur.set.has(ivK)) t+=`, outside ${modeName()}`;
  if(st.mode==='drill'&&!picking()){
    const ivC=ivOf(p,cur.chord.root);
    t+=cur.chordPcs.has(pc(p.s,p.f))?`, and the ${chordIv(cur.chord,ivC)[1]} of the ${cur.chord.name} chord`:`. Not in the ${cur.chord.name} chord`;
  }
  return t+'.';
}
function cellTip(el){
  const p={s:+el.dataset.s,f:+el.dataset.f}, where=`${STR_NAME[p.s]} string, ${p.f?'fret '+p.f:'open'}`;
  if((st.mode==='name'||st.mode==='find')&&st.q&&!st.q.answered) return where+'.';  // no hints mid-question
  return `${degreeText(p)}<br>${where}.`;
}
function tabTip(el){
  const n=st.seq[+el.dataset.j]; if(!n) return '';
  if(n.rest){let i=+el.dataset.j-1; while(i>=0&&st.seq[i].rest) i--; // a rest right after a strum lets the chord ring
    if(st.seq[i]&&st.seq[i].chord) return `<b>Rest</b>: let the chord ring${!cur.prog&&D.pad?' until the line comes in on beat 2':''}.`;
    return '<b>Rest</b>: the line has finished, so let the last note ring to the end of the bar.';}
  if(cur.prog&&n.ci!==undefined){
    const keep=cur.pci; setProgChord(n.ci); let t;
    if(n.chord){const L=countLabels(n.n)[n.k], dir=(n.down??n.k%2===0)?'down':'up';
      t=`<b>${cur.chord.name}</b> (${cur.chord.roman}), ${n.strum==='.'?`(${L})`:L}: ${n.strum==='.'?`ghost, the hand moves ${dir} past the strings`:`${STEP_NAME[n.strum]}, ${dir}`}.`+(n.head?` Voicing ${cur.voicing.frets.map(f=>f===null?'x':f).join(' ')}, low to high.`:'');}
    else t=`${degreeText(n)}<br>${STR_NAME[n.s]} string, fret ${n.f}, finger ${finger(n)}.`;
    setProgChord(keep); return t;
  }
  if(n.rest) return 'Rest.';
  if(n.chord) return `Strum <b>${cur.chord.name}</b> (${cur.chord.roman}): ${cur.voicing.frets.map(f=>f===null?'x':f).join(' ')}, low to high.`;
  return `${degreeText(n)}<br>${STR_NAME[n.s]} string, fret ${n.f}, finger ${finger(n)}.`;
}

  o+=`<rect x="${O}" y="${P-RH/2}" width="${G*N}" height="${RH*6}" rx="5" style="fill:var(--wood)"/>`;
  if(b.spot&&b.fr){const fz=b.fr.filter(f=>f>0); if(fz.length){const a=Math.min(...fz), z=Math.max(...fz); o+=`<rect x="${O+(a-1)*G}" y="${P-RH/2}" width="${(z-a+1)*G}" height="${RH*6}" fill="#F5E6C4" opacity=".1"/>`;}}

  o+=`<line x1="${O}" y1="${P-RH/2}" x2="${O}" y2="${P+RH*5.5}" style="stroke:var(--pearl)" stroke-width="7"/>`;
  [3,5,7,9].forEach(f=>o+=`<circle cx="${fx(f)}" cy="${P+2.5*RH}" r="5" style="fill:var(--pearl)" opacity=".55"/>`);
  [1.5,3.5].forEach(k=>o+=`<circle cx="${fx(12)}" cy="${P+k*RH}" r="5" style="fill:var(--pearl)" opacity=".55"/>`);
  for(let s=0;s<6;s++) o+=`<line x1="0" y1="${sy(s)}" x2="${O+G*N}" y2="${sy(s)}" stroke="#cfc8b8" stroke-width="${STR_W[s]}"/>`;

    if(step===1||!b.fr) continue;

    const iv=(pc(s,f)-b.root+12)%12, t=chordIv(ch,iv)[0], x=fx(f);
    if(f===0){o+=`<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${COL[iv]}" stroke-width="3"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink)">${t}</text>`; continue;}
    if(iv===0) o+=`<circle cx="${x}" cy="${y}" r="13" style="fill:var(--pearl)"/>`;
    o+=`<circle cx="${x}" cy="${y}" r="10.5" fill="${COL[iv]}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="${t.length>1?9:11}" font-weight="700" fill="#14110d">${t}</text>`;

// ---- the builder's three steps. b: {root,suf,spot,fr} (the chord being built); ui: {step,mode}; o.id names its folds; o.big: step 1 uses the big neck ----

function cbAct(el,b,ui,o){ // a click in the builder: returns true when it changed something to redraw

  if(k==='fold'){const f=cbFolds(o.id); f[el.dataset.p]=!f[el.dataset.p]; save(); return true;}
  if(k==='mode'){ui.mode=el.dataset.v; return true;}
  if(k==='scroll'){const t=el.parentElement.querySelector('.cb-track'); if(t) t.scrollLeft+=+el.dataset.dir*400; return false;}
  if(k==='hear'){if(b.fr) hearFrets(b.fr); return false;}

function cbRedraw(host,draw){ // redraw, keeping the strips where they were scrolled and the focus on the same control

function cpOpen(ctx,at){

function cpStop(){if(CP&&CP.play){clearTimeout(CP.play.timer); CP.play=null; cpEl.querySelectorAll('.cpm-bar.now').forEach(e=>e.classList.remove('now')); const b=cpEl.querySelector('[data-cp=play]'); if(b) b.textContent='▶ Play';}}
function cpPlay(){ // loop the sketch in the strum pattern at the tempo, without saving it or touching Drill

  CP.play={bar:0,next:ac.currentTime+0.1,timer:0};

    CP.play.timer=setTimeout(tick,80);};
